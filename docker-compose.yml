services:
  # Database MySQL
  database:
    image: mysql:8.0-oracle
    container_name: sgp-mysql
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-accounts}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_run:/var/run/mysqld
    networks:
      - sgp-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p${DB_ROOT_PASSWORD:-password} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 60s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: sgp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "7000:6379"
    volumes:
      - redis_data:/data
    networks:
      - sgp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1g"
        reservations:
          cpus: "0.25"
          memory: "256M"
    restart: unless-stopped

  # Account Service
  account-service:
    build:
      context: ./services/account-service
      dockerfile: Dockerfile
    container_name: sgp-account-service
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      SERVICE_PORT: ${ACCOUNT_SERVICE_PORT:-10001}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NODE_ENV: ${NODE_ENV:-development}      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}      
      # Database
      DATABASE_URL: mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@database:3306/${DB_NAME:-accounts}      
      # App
      APP_SECRET: ${APP_SECRET:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
    ports:
      - "10001:10001"
    volumes:
      - ./services/account-service:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/build  # ← Protege também a pasta build
    working_dir: /usr/src/app
    networks:
      - sgp-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "1g"
        reservations:
          cpus: "0.5"
          memory: "512M"
    restart: unless-stopped

networks:
  sgp-network:
    driver: bridge

volumes:
  mysql_data:
  mysql_run:
  redis_data:

