services:
  traefik:
    image: traefik:v2.10
    container_name: sgp-traefik
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP
      - "443:443"     # HTTPS
      - "8080:8080"   # Dashboard
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=sgp-network"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--log.level=INFO"
      - "--accesslog.filepath=/var/log/traefik/access.log"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/logs:/var/log/traefik
      # - ./traefik/letsencrypt:/letsencrypt  # SSL certificates
    networks:
      - sgp-network
    labels:
      - "traefik.enable=true"
      ## Dashboard
      - "traefik.http.routers.dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.entrypoints=web"
  # Database MySQL
  database:
    image: mysql:8.0-oracle
    container_name: sgp-mysql
    environment:
      TZ: America/Sao_Paulo
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_NAME:-accounts}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_run:/var/run/mysqld
    networks:
      - sgp-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -u root -p${DB_ROOT_PASSWORD:-password} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: "512M"
        reservations:
          cpus: "0.25"
          memory: "128M"
      restart_policy:
        condition: on-failure
        delay: 30s
        max_attempts: 3
        window: 60s
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    container_name: sgp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "7000:6379"
    volumes:
      - redis_data:/data
    networks:
      - sgp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1g"
        reservations:
          cpus: "0.25"
          memory: "256M"
    restart: unless-stopped

  # Account Service
  account-service:
    image: node:18
    container_name: sgp-account-service
    command:  sh -c "./start.sh"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      SERVICE_PORT: ${ACCOUNT_SERVICE_PORT:-10001}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NODE_ENV: ${NODE_ENV:-development}      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}      
      # Database
      DATABASE_URL: mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@database:3306/${DB_NAME_ACCOUNT:-accounts}      
      # App
      APP_SECRET: ${APP_SECRET:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      INTERNAL_SERVICE_TOKEN: BEARER:bV9hbKAq4R4zjHSzk
      UPDATE: '1'
    ports:
      - "10001:10001"
    volumes:
      - ./services/account-service:/app
      #- /usr/src/app/node_modules
      #- /usr/src/app/build  # ← Protege também a pasta build
    working_dir: /app
    networks:
      - sgp-network
    labels:
      - "traefik.enable=true"
      # HTTP Router
      - "traefik.http.routers.account.rule=Host(`api.localhost`) && PathPrefix(`/api/accounts`)"
      - "traefik.http.routers.account.entrypoints=web"
      - "traefik.http.routers.account.service=account"
      # Middleware - Strip prefix
      - "traefik.http.middlewares.account-strip.stripprefix.prefixes=/api/accounts"
      - "traefik.http.routers.account.middlewares=account-strip"
      # Service
      - "traefik.http.services.account.loadbalancer.server.port=10001"
    mem_limit: 1g

  security-service:
    image: node:18
    container_name: sgp-security-service
    command:  sh -c "./start.sh"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: America/Sao_Paulo
      SERVICE_PORT: ${SECURITY_SERVICE_PORT:-10002}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      NODE_ENV: ${NODE_ENV:-development}      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}      
      # Database
      DATABASE_URL: mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@database:3306/${DB_NAME_SECURITY:-security}      
      # App
      APP_SECRET: ${APP_SECRET:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      INTERNAL_SERVICE_TOKEN: BEARER:bV9hbKAq4R4zjHSzk
      UPDATE: '3'
    ports:
      - "10002:10002"
    volumes:
      - ./services/security-service:/app
    working_dir: /app
    networks:
      - sgp-network
    labels:
      - "traefik.enable=true"
      # HTTP Router
      - "traefik.http.routers.security.rule=Host(`api.localhost`) && PathPrefix(`/api/security`)"
      - "traefik.http.routers.security.entrypoints=web"
      - "traefik.http.routers.security.service=security"
      # Middleware - Strip prefix
      - "traefik.http.middlewares.security-strip.stripprefix.prefixes=/api/security"
      - "traefik.http.routers.security.middlewares=security-strip"
      # Service
      - "traefik.http.services.security.loadbalancer.server.port=10002"
    mem_limit: 1g

networks:
  sgp-network:
    driver: bridge
    

volumes:
  mysql_data:
  mysql_run:
  redis_data:

